[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plainmem"
version = "0.1.1"
description = "Markdown-first long-term memory for AI agents, with freshness and supersession awareness."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Harsh Shroff"}]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Indexing",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
embeddings = ["sentence-transformers>=3"]
demo = ["streamlit>=1.40"]
dev = ["pytest>=8", "pytest-timeout>=2", "ruff>=0.6"]

[project.scripts]
plainmem = "plainmem.cli:main"
plainmem-mcp = "plainmem.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plainmem = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"bench/synth.py" = ["E501"]  # template strings for the synthetic corpus read better unwrapped
